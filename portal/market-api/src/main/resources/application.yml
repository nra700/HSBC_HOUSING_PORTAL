server:
  port: 8002

market:
  dataset-path: ${DATASET_PATH:../../data/housing.csv}
  model-api-url: ${MODEL_API_URL:http://localhost:8000}

spring:
  cache:
    type: caffeine
    cache-names: summary,segments,modelInfo,whatIf
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

management:
  endpoints:
    web:
      exposure:
        include: health
